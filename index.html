<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Resume Builder & Portfolio Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .form-section, .preview-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .form-section h2, .preview-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="url"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.3em;
            margin-top: 20px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .add-btn {
            background: #28a745;
            font-size: 0.9em;
            padding: 8px 15px;
        }
        
        .remove-btn {
            background: #dc3545;
            font-size: 0.8em;
            padding: 5px 10px;
            margin-top: 5px;
        }
        
        /* Preview Styles */
        .preview {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .preview-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }
        
        .preview-name {
            font-size: 2em;
            color: #333;
            font-weight: bold;
        }
        
        .preview-contact {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .preview-section-title {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 5px;
        }
        
        .preview-entry {
            margin-bottom: 12px;
            color: #333;
        }
        
        .preview-entry-title {
            font-weight: bold;
            color: #333;
        }
        
        .preview-entry-subtitle {
            color: #666;
            font-style: italic;
            font-size: 0.95em;
        }
        
        .preview-entry-description {
            color: #555;
            margin-top: 3px;
            font-size: 0.95em;
        }
        
        .item-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .action-buttons {
            text-align: center;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Resume Builder & Portfolio Generator</h1>
            <p>Create a professional resume and portfolio in minutes</p>
        </header>
        
        <div class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <h2>Build Your Resume</h2>
                
                <!-- Personal Information -->
                <div class="section-title">Personal Information</div>
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="City, Country">
                </div>
                <div class="form-group">
                    <label for="website">Website/Portfolio</label>
                    <input type="url" id="website" placeholder="https://yourportfolio.com">
                </div>
                <div class="form-group">
                    <label for="summary">Professional Summary</label>
                    <textarea id="summary" placeholder="Write a brief summary about yourself..."></textarea>
                </div>
                
                <!-- Education -->
                <div class="section-title">Education</div>
                <div id="educationContainer"></div>
                <button class="add-btn" onclick="addEducation()">+ Add Education</button>
                
                <!-- Experience -->
                <div class="section-title">Work Experience</div>
                <div id="experienceContainer"></div>
                <button class="add-btn" onclick="addExperience()">+ Add Experience</button>
                
                <!-- Skills -->
                <div class="section-title">Skills</div>
                <div class="form-group">
                    <label for="skills">Skills (comma-separated)</label>
                    <textarea id="skills" placeholder="JavaScript, HTML, CSS, React..."></textarea>
                </div>
                
                <!-- Social Links -->
                <div class="section-title">Social Links</div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn</label>
                    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                </div>
                <div class="form-group">
                    <label for="github">GitHub</label>
                    <input type="url" id="github" placeholder="https://github.com/yourprofile">
                </div>
                
                <div class="action-buttons">
                    <button onclick="generateResume()">📥 Generate Resume</button>
                    <button class="btn-secondary" onclick="clearForm()">🔄 Clear All</button>
                </div>
            </div>
            
            <!-- Preview Section -->
            <div class="preview-section">
                <h2>Resume Preview</h2>
                <div id="resumePreview">
                    <div class="preview-header">
                        <div class="preview-name">Your Name</div>
                        <div class="preview-contact">Email • Phone • Location</div>
                    </div>
                    <p style="color: #999; text-align: center;">Fill in the form to see your resume preview here</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let educationCount = 0;
        let experienceCount = 0;
        
        function addEducation() {
            const container = document.getElementById('educationContainer');
            const id = educationCount++;
            const html = `
                <div class="item-group" id="education-${id}">
                    <div class="form-group">
                        <label>School/College Name</label>
                        <input type="text" class="edu-school" placeholder="University Name">
                    </div>
                    <div class="form-group">
                        <label>Degree</label>
                        <input type="text" class="edu-degree" placeholder="Bachelor of Science">
                    </div>
                    <div class="form-group">
                        <label>Field of Study</label>
                        <input type="text" class="edu-field" placeholder="Computer Science">
                    </div>
                    <div class="form-group">
                        <label>Graduation Year</label>
                        <input type="text" class="edu-year" placeholder="2023">
                    </div>
                    <button class="remove-btn" onclick="removeEducation(${id})">Remove</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            updatePreview();
        }
        
        function removeEducation(id) {
            const element = document.getElementById(`education-${id}`);
            if (element) {
                element.remove();
                updatePreview();
            }
        }
        
        function addExperience() {
            const container = document.getElementById('experienceContainer');
            const id = experienceCount++;
            const html = `
                <div class="item-group" id="experience-${id}">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" class="exp-title" placeholder="Software Developer">
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" class="exp-company" placeholder="Company Name">
                    </div>
                    <div class="form-group">
                        <label>Duration</label>
                        <input type="text" class="exp-duration" placeholder="Jan 2020 - Dec 2022">
                    </div>
                    <div class="form-group">
                        <label>Job Description</label>
                        <textarea class="exp-description" placeholder="Describe your responsibilities and achievements..."></textarea>
                    </div>
                    <button class="remove-btn" onclick="removeExperience(${id})">Remove</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            updatePreview();
        }
        
        function removeExperience(id) {
            const element = document.getElementById(`experience-${id}`);
            if (element) {
                element.remove();
                updatePreview();
            }
        }
        
        function updatePreview() {
            const preview = document.getElementById('resumePreview');
            const name = document.getElementById('fullName').value || 'Your Name';
            const email = document.getElementById('email').value || 'email@example.com';
            const phone = document.getElementById('phone').value || '';
            const location = document.getElementById('location').value || '';
            const summary = document.getElementById('summary').value || '';
            const skills = document.getElementById('skills').value || '';
            const website = document.getElementById('website').value || '';
            const linkedin = document.getElementById('linkedin').value || '';
            const github = document.getElementById('github').value || '';
            
            let html = `
                <div class="preview-header">
                    <div class="preview-name">${name}</div>
                    <div class="preview-contact">
                        ${email}${phone ? ' • ' + phone : ''}${location ? ' • ' + location : ''}
                    </div>
                    ${website ? `<div class="preview-contact"><a href="${website}" target="_blank">${website}</a></div>` : ''}
                </div>
            `;
            
            if (summary) {
                html += `<div><div class="preview-section-title">Professional Summary</div><div class="preview-entry">${summary}</div></div>`;
            }
            
            // Education
            const educationItems = document.querySelectorAll('#educationContainer .item-group');
            if (educationItems.length > 0) {
                html += '<div class="preview-section-title">Education</div>';
                educationItems.forEach(item => {
                    const school = item.querySelector('.edu-school').value || '';
                    const degree = item.querySelector('.edu-degree').value || '';
                    const field = item.querySelector('.edu-field').value || '';
                    const year = item.querySelector('.edu-year').value || '';
                    if (school || degree) {
                        html += `
                            <div class="preview-entry">
                                <div class="preview-entry-title">${degree}${field ? ' in ' + field : ''}</div>
                                <div class="preview-entry-subtitle">${school}${year ? ' • ' + year : ''}</div>
                            </div>
                        `;
                    }
                });
            }
            
            // Experience
            const experienceItems = document.querySelectorAll('#experienceContainer .item-group');
            if (experienceItems.length > 0) {
                html += '<div class="preview-section-title">Work Experience</div>';
                experienceItems.forEach(item => {
                    const title = item.querySelector('.exp-title').value || '';
                    const company = item.querySelector('.exp-company').value || '';
                    const duration = item.querySelector('.exp-duration').value || '';
                    const description = item.querySelector('.exp-description').value || '';
                    if (title || company) {
                        html += `
                            <div class="preview-entry">
                                <div class="preview-entry-title">${title}</div>
                                <div class="preview-entry-subtitle">${company}${duration ? ' • ' + duration : ''}</div>
                                ${description ? `<div class="preview-entry-description">${description}</div>` : ''}
                            </div>
                        `;
                    }
                });
            }
            
            // Skills
            if (skills) {
                html += `<div class="preview-section-title">Skills</div><div class="preview-entry">${skills.split(',').map(s => s.trim()).join(' • ')}</div>`;
            }
            
            // Social Links
            const hasSocial = linkedin || github;
            if (hasSocial) {
                html += '<div class="preview-section-title">Connect</div>';
                if (linkedin) html += `<div class="preview-entry"><a href="${linkedin}" target="_blank">LinkedIn</a></div>`;
                if (github) html += `<div class="preview-entry"><a href="${github}" target="_blank">GitHub</a></div>`;
            }
            
            preview.innerHTML = html;
        }
        
        function generateResume() {
            updatePreview();
            alert('✅ Resume generated! You can print or download it using your browser\'s print function (Ctrl+P or Cmd+P)');
        }
        
        function clearForm() {
            if (confirm('Are you sure you want to clear all data?')) {
                document.querySelectorAll('input, textarea').forEach(el => el.value = '');
                document.getElementById('educationContainer').innerHTML = '';
                document.getElementById('experienceContainer').innerHTML = '';
                educationCount = 0;
                experienceCount = 0;
                updatePreview();
            }
        }
        
        // Update preview as user types
        document.addEventListener('input', function() {
            updatePreview();
        });
        
        // Initial preview
        updatePreview();
    </script>
</body>
</html>
